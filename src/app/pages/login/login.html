<div class="page">
    <mat-card class="card">
        <mat-card-title class="title">Bem Vindo !!!</mat-card-title>

        <form [formGroup]="loginForm" class="content">
            <mat-form-field appearance="outline" class="field">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" placeholder="seuemail@exemplo.com" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="field">
                <mat-label>Senha</mat-label>
                <input matInput type="password" formControlName="password" placeholder="digite sua senha" />
            </mat-form-field>

            <div class="signup-minitext">
                <a href="#">Esqueci a senha</a>
            </div>

            <button mat-raised-button class="btn" type="button">
                Login
            </button>

            <div class="signup-text">
                Não tem conta, <a href="#">cadastre-se aqui</a>
            </div>

        </form>

    </mat-card>
</div>
